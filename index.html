<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CANTAVENERA</title>

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<meta property="og:title" content="CANTAVENERA">
<meta property="og:description" content="La Famiglia">
<meta property="og:image" content="https://cantavenera.com/share.png">
<meta property="og:url" content="https://cantavenera.com">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="CANTAVENERA">
<meta name="twitter:description" content="La Famiglia">
<meta name="twitter:image" content="https://cantavenera.com/share.png">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --soft:rgba(232,199,139,.76);
}

html,body{
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  background:#050505;
  font-family:"Inter", sans-serif;
}

.hero{
  position:relative;
  width:100%;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;

  background-image:
    linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.54)),
    url("cantavenera-liggande-2.png");

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at center, transparent 28%, rgba(0,0,0,.78) 100%);
  pointer-events:none;
}

.content{
  position:relative;
  z-index:2;
  width:100%;
  padding:0 3vw;
}

.kicker{
  font-family:"Cormorant Garamond", serif;
  font-size:clamp(.9rem,1.5vw,1.55rem);
  font-weight:500;
  letter-spacing:.52em;
  text-transform:uppercase;
  color:var(--soft);
  margin-bottom:1.35rem;
  text-shadow:0 6px 18px rgba(0,0,0,.9);
}

.divider{
  width:150px;
  height:1px;
  margin:0 auto 2.1rem;
  background:linear-gradient(to right, transparent, rgba(232,199,139,.95), transparent);
}

h1{
  font-family:"Cormorant Garamond", serif;
  font-weight:400;
  font-size:clamp(2.7rem, 9.2vw, 9.2rem);
  letter-spacing:clamp(.025em,.62vw,.105em);
  line-height:.88;
  text-transform:uppercase;
  white-space:nowrap;

  background:linear-gradient(
    180deg,
    #fff6d8 0%,
    #efd08a 18%,
    #c58d3c 38%,
    #fff1bd 52%,
    #b77c32 70%,
    #6f451c 100%
  );

  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;

  -webkit-text-stroke:.35px rgba(255,239,190,.28);

  text-shadow:
    0 1px 0 rgba(255,255,255,.13),
    0 5px 14px rgba(0,0,0,.98),
    0 22px 55px rgba(0,0,0,.95);

  filter:drop-shadow(0 0 10px rgba(220,168,82,.18));
}

footer{
  position:absolute;
  z-index:3;
  left:50%;
  bottom:4vh;
  transform:translateX(-50%);
  width:100%;
  padding:0 1rem;

  font-family:"Cormorant Garamond", serif;
  font-size:clamp(.55rem,.9vw,.74rem);
  letter-spacing:.28em;
  text-transform:uppercase;

  color:rgba(232,199,139,.68);
  text-shadow:0 5px 15px rgba(0,0,0,.9);
}

@media(max-width:768px){
  .content{
    padding:0 1rem;
  }

  .kicker{
    letter-spacing:.32em;
  }

  .divider{
    width:90px;
  }

  h1{
    font-size:clamp(2rem, 12vw, 4.8rem);
    letter-spacing:clamp(.01em,.35vw,.045em);
  }

  footer{
    letter-spacing:.14em;
    line-height:1.7;
  }
}

@media(max-width:430px){
  h1{
    font-size:clamp(1.75rem, 10.5vw, 3.2rem);
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="content">
    <div class="kicker">LA FAMIGLIA</div>
    <div class="divider"></div>
    <h1>CANTAVENERA</h1>
  </div>

  <footer>
    © 2026 CANTAVENERA — ALL RIGHTS RESERVED
  </footer>

</section>

</body>
</html>
