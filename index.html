<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>CANTAVENERA</title>

<!-- =========================
     FAVICON
========================= -->

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<!-- =========================
     SHARE PREVIEW
========================= -->

<meta property="og:title" content="CANTAVENERA">
<meta property="og:description" content="La Famiglia">
<meta property="og:image" content="https://cantavenera.com/share.png">
<meta property="og:url" content="https://cantavenera.com">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="CANTAVENERA">
<meta name="twitter:description" content="La Famiglia">
<meta name="twitter:image" content="https://cantavenera.com/share.png">

<!-- =========================
     FONTS
========================= -->

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#070707;
  --gold:#e6d1ad;
  --gold-soft:rgba(230,209,173,0.72);
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  background:var(--bg);
  overflow-x:hidden;
  font-family:"Inter", sans-serif;
}

/* =========================
   HERO SECTION
========================= */

.hero{

  min-height:100vh;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:7vh 5vw;

  background-image:

    linear-gradient(
      rgba(0,0,0,0.30),
      rgba(0,0,0,0.42)
    ),

    url("liggande.png");

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  background-attachment:fixed;
}

/* cinematic vignette */

.hero::after{

  content:'';

  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at center,
      transparent 30%,
      rgba(0,0,0,0.72) 100%
    );

  pointer-events:none;
}

/* =========================
   CONTENT
========================= */

.content{

  position:relative;
  z-index:2;

  width:100%;
  max-width:1600px;

  padding-inline:1rem;
}

/* =========================
   TOP TEXT
========================= */

.kicker{

  font-family:"Cormorant Garamond", serif;

  font-size:
    clamp(0.95rem, 1.8vw, 1.8rem);

  font-weight:400;

  letter-spacing:0.55em;

  text-transform:uppercase;

  color:var(--gold-soft);

  margin-bottom:1.5rem;

  text-shadow:
    0 4px 18px rgba(0,0,0,0.75);
}

/* =========================
   DIVIDER
========================= */

.divider{

  width:160px;
  height:1px;

  margin:0 auto 2rem;

  background:
    linear-gradient(
      to right,
      transparent,
      rgba(230,209,173,0.85),
      transparent
    );

  box-shadow:
    0 0 12px rgba(230,209,173,0.15);
}

/* =========================
   MAIN TITLE
========================= */

h1{

  font-family:"Cormorant Garamond", serif;
  font-weight:500;

  font-size:
    clamp(3rem, 10vw, 10rem);

  letter-spacing:0.14em;

  line-height:0.92;

  text-transform:uppercase;

  width:100%;

  white-space:nowrap;

  /* GOLD METALLIC EFFECT */

  background:
    linear-gradient(
      180deg,
      #f7e7c6 0%,
      #d6b98b 22%,
      #fff4df 38%,
      #b58a54 52%,
      #f3d7a8 68%,
      #8b673d 100%
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  text-shadow:
    0 1px 0 rgba(255,255,255,0.15),
    0 2px 6px rgba(0,0,0,0.85),
    0 12px 35px rgba(0,0,0,0.75);

  filter:
    drop-shadow(0 0 12px rgba(214,185,139,0.12));

  position:relative;
}

/* subtle metallic reflection */

h1::after{

  content:'';

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      120deg,
      transparent 0%,
      rgba(255,255,255,0.18) 45%,
      transparent 60%
    );

  mix-blend-mode:screen;

  opacity:0.35;

  pointer-events:none;
}

/* =========================
   FOOTER
========================= */

footer{

  position:absolute;

  left:50%;
  bottom:4vh;

  transform:translateX(-50%);

  z-index:3;

  width:100%;

  padding-inline:1rem;

  text-align:center;

  font-size:
    clamp(0.6rem, 1vw, 0.82rem);

  letter-spacing:0.32em;

  text-transform:uppercase;

  color:
    rgba(230,209,173,0.72);

  text-shadow:
    0 4px 14px rgba(0,0,0,0.7);
}

/* =========================
   TABLET
========================= */

@media (max-width:768px){

  .hero{
    background-attachment:scroll;
    padding:6vh 1.2rem;
  }

  h1{

    font-size:
      clamp(2.1rem, 13vw, 5rem);

    letter-spacing:
      clamp(0.04em, 1vw, 0.08em);
  }

  .kicker{
    letter-spacing:0.38em;
  }

  .divider{
    width:100px;
  }

  footer{
    letter-spacing:0.16em;
    line-height:1.8;
  }
}

/* =========================
   SMALL MOBILE
========================= */

@media (max-width:480px){

  h1{
    font-size:
      clamp(1.8rem, 11vw, 3.2rem);

    letter-spacing:0.04em;
  }

  .kicker{
    font-size:0.72rem;
  }

  footer{
    font-size:0.55rem;
  }
}

</style>
</head>

<body>

<main class="hero">

  <section class="content">

    <div class="kicker">
      LA FAMIGLIA
    </div>

    <div class="divider"></div>

    <h1>
      CANTAVENERA
    </h1>

  </section>

  <footer>
    © 2026 CANTAVENERA — ALL RIGHTS RESERVED
  </footer>

</main>

</body>
</html>
