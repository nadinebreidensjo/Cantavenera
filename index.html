<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>CANTAVENERA</title>

<!-- =========================
     FAVICON
========================= -->

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<!-- =========================
     SHARE PREVIEW
========================= -->

<meta property="og:title" content="CANTAVENERA">
<meta property="og:description" content="La Famiglia">
<meta property="og:image" content="https://cantavenera.com/share.png">
<meta property="og:url" content="https://cantavenera.com">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="CANTAVENERA">
<meta name="twitter:description" content="La Famiglia">
<meta name="twitter:image" content="https://cantavenera.com/share.png">

<!-- =========================
     FONTS
========================= -->

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --gold:#e7c88b;
  --gold-soft:rgba(231,200,139,0.72);
  --bg:#050505;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  background:#000;
  font-family:"Inter", sans-serif;
}

/* =========================
   HERO
========================= */

.hero{

  position:relative;

  width:100%;
  height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  background-image:

    linear-gradient(
      rgba(0,0,0,0.34),
      rgba(0,0,0,0.46)
    ),

    url("liggande.png");

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

/* cinematic depth */

.hero::after{

  content:'';

  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at center,
      transparent 30%,
      rgba(0,0,0,0.78) 100%
    );

  pointer-events:none;
}

/* =========================
   CONTENT
========================= */

.content{

  position:relative;
  z-index:2;

  width:100%;

  text-align:center;

  padding-inline:2rem;
}

/* =========================
   TOP TEXT
========================= */

.kicker{

  font-family:"Cormorant Garamond", serif;

  font-size:
    clamp(0.9rem, 1.5vw, 1.4rem);

  font-weight:500;

  letter-spacing:0.55em;

  text-transform:uppercase;

  color:var(--gold-soft);

  margin-bottom:1.3rem;

  text-shadow:
    0 4px 16px rgba(0,0,0,0.85);
}

/* =========================
   DIVIDER
========================= */

.divider{

  width:140px;
  height:1px;

  margin:0 auto 2.2rem;

  background:
    linear-gradient(
      to right,
      transparent,
      rgba(231,200,139,0.9),
      transparent
    );

  box-shadow:
    0 0 14px rgba(231,200,139,0.14);
}

/* =========================
   MAIN TITLE
========================= */

h1{

  font-family:"Cinzel", serif;
  font-weight:600;

  font-size:
    clamp(2.8rem, 9.5vw, 9.5rem);

  letter-spacing:
    clamp(0.03em, 0.75vw, 0.12em);

  line-height:0.9;

  text-transform:uppercase;

  white-space:nowrap;

  /* GOLD METALLIC */

  background:
    linear-gradient(
      180deg,
      #fff1cf 0%,
      #e3bd72 20%,
      #b9873f 46%,
      #f4d493 62%,
      #7b5426 100%
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  text-shadow:
    0 2px 0 rgba(255,255,255,0.08),
    0 8px 18px rgba(0,0,0,0.95),
    0 20px 45px rgba(0,0,0,0.9);

  filter:
    drop-shadow(0 0 10px rgba(201,151,76,0.12));
}

/* =========================
   FOOTER
========================= */

footer{

  position:absolute;

  left:50%;
  bottom:4vh;

  transform:translateX(-50%);

  z-index:3;

  width:100%;

  text-align:center;

  padding-inline:1rem;

  font-size:
    clamp(0.58rem, 1vw, 0.78rem);

  letter-spacing:0.3em;

  text-transform:uppercase;

  color:
    rgba(231,200,139,0.72);

  text-shadow:
    0 4px 14px rgba(0,0,0,0.85);
}

/* =========================
   MOBILE
========================= */

@media (max-width:768px){

  h1{

    font-size:
      clamp(2rem, 12vw, 4.8rem);

    letter-spacing:
      clamp(0.02em, 0.3vw, 0.06em);

    white-space:normal;
  }

  .kicker{
    letter-spacing:0.3em;
  }

  .divider{
    width:90px;
  }

  footer{
    letter-spacing:0.14em;
    line-height:1.7;
  }
}

</style>
</head>

<body>

<section class="hero">

  <div class="content">

    <div class="kicker">
      LA FAMIGLIA
    </div>

    <div class="divider"></div>

    <h1>
      CANTAVENERA
    </h1>

  </div>

  <footer>
    © 2026 CANTAVENERA — ALL RIGHTS RESERVED
  </footer>

</section>

</body>
</html>
